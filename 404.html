<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 找不到頁面 — Switch Image</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon/favicon.ico" sizes="any" />
  <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="./assets/brand/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />

  <!-- Modular CSS -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/hero.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/error.css" />

  <!-- Modular JavaScript -->
  <script defer src="./js/core/extended-locales.js"></script>
  <script defer src="./js/core/i18n.js"></script>
  <script defer src="./js/ui/theme.js"></script>
  <script defer src="./js/ui/error-page.js"></script>
</head>
<body data-title-key="err404.pageTitle">
  <div class="container error-container">
    <!-- Minimal Top Navigation -->
    <nav class="topbar" data-i18n-aria="nav.aria" aria-label="站台導覽">
      <a id="brandHomeLink" class="topbar-brand topbar-brand-link" href="./index.html" aria-label="Switch Image">
        <img class="topbar-logo" src="./assets/brand/logo.svg" alt="Switch Image Logo" width="38" height="38" />
        <span class="topbar-name">Switch Image</span>
      </a>
      <div class="topbar-actions">
        <span class="badge">
          <span class="badge-dot"></span><span><span data-i18n="nav.badgeMain">100% 本地運算</span><span class="badge-extra" data-i18n="nav.badgeExtra">・不上傳</span></span>
        </span>
        <div class="lang-select-wrap">
          <img class="ui-icon icon-adaptive lang-select-icon" src="./assets/icons/globe.svg" alt="" width="15" height="15" aria-hidden="true" />
          <select id="langSelect" class="lang-select" data-lang-select data-i18n-aria="nav.langAria" aria-label="切換介面語言">
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="es">Español</option>
            <option value="zh-Hans">简体中文</option>
            <option value="ko">한국어</option>
            <option value="th">ไทย</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </div>
        <div class="theme-segmented" role="group" data-i18n-aria="sheet.themeHeading" aria-label="外觀主題">
          <button type="button" class="theme-seg-btn" data-theme-btn="light" data-i18n-title="sheet.themeLight" data-i18n-aria="sheet.themeLight" title="淺色模式" aria-label="淺色模式">
            <img class="ui-icon" src="./assets/icons/sun.svg" alt="" width="16" height="16" aria-hidden="true" />
          </button>
          <button type="button" class="theme-seg-btn" data-theme-btn="dark" data-i18n-title="sheet.themeDark" data-i18n-aria="sheet.themeDark" title="深色模式" aria-label="深色模式">
            <img class="ui-icon icon-adaptive" src="./assets/icons/moon.svg" alt="" width="16" height="16" aria-hidden="true" />
          </button>
          <button type="button" class="theme-seg-btn" data-theme-btn="system" data-i18n-title="sheet.themeSystem" data-i18n-aria="sheet.themeSystem" title="跟隨系統" aria-label="跟隨系統">
            <img class="ui-icon icon-adaptive" src="./assets/icons/monitor.svg" alt="" width="16" height="16" aria-hidden="true" />
          </button>
        </div>
        <button id="themeToggle" type="button" class="btn-icon theme-cycle-mobile" data-i18n-title="nav.themeTitle" data-i18n-aria="nav.themeTitle" title="切換深色／淺色主題" aria-label="切換深色／淺色主題">
          <img id="themeIcon" class="ui-icon icon-adaptive" src="./assets/icons/monitor.svg" alt="" width="18" height="18" aria-hidden="true" />
        </button>
      </div>
    </nav>

    <!-- Centered 404 Studio Card -->
    <main class="error-main">
      <section class="card error-card" aria-labelledby="errorHeading">
        <img class="error-illustration" src="./assets/illustrations/not-found.svg" alt="" width="208" height="128" aria-hidden="true" />
        <span class="error-code-pill">HTTP 404 · PAGE NOT FOUND</span>
        <h1 id="errorHeading" class="error-title" data-i18n="err404.heading">找不到這個頁面</h1>
        <p class="error-desc" data-i18n="err404.desc">
          您造訪的連結可能已移動、刪除，或網址輸入有誤。別擔心，回到首頁即可立即使用圖片格式極速互轉。
        </p>
        <div id="missingPath" class="error-path hidden" aria-live="polite"></div>

        <div class="error-actions">
          <a id="homeLink" href="./index.html" class="btn btn-primary btn-lg">
            <img class="ui-icon icon-adaptive" src="./assets/icons/home.svg" alt="" width="17" height="17" aria-hidden="true" />
            <span data-i18n="err404.goHome">回到圖片轉檔首頁</span>
          </a>
          <button id="goBackBtn" type="button" class="btn btn-secondary btn-lg">
            <img class="ui-icon icon-adaptive" src="./assets/icons/arrow-left.svg" alt="" width="17" height="17" aria-hidden="true" />
            <span data-i18n="err404.goBack">返回上一頁</span>
          </button>
        </div>

        <div class="error-formats-note">
          <img class="ui-icon" src="./assets/icons/sparkles.svg" alt="" width="14" height="14" aria-hidden="true" />
          <span data-i18n="err404.formatsNote">支援 JPEG XL、HEIC、PSD、TIFF、TGA 與 RAW 預覽的本地轉檔</span>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-i18n="footer.privacy">
      Switch Image 100% 瀏覽器本地運算・純淨無廣告・檔案絕不離開您的裝置。
    </footer>
  </div>
</body>
</html>
