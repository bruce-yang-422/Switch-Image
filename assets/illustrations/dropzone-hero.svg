<svg xmlns="http://www.w3.org/2000/svg" width="144" height="96" viewBox="0 0 144 96" fill="none">
  <defs>
    <linearGradient id="dzGlow" x1="20" y1="8" x2="124" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="dzBackCard" x1="22" y1="18" x2="76" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="dzFrontCard" x1="48" y1="14" x2="112" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#eff6ff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="dzMtn" x1="56" y1="44" x2="100" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dzBadge" x1="94" y1="48" x2="124" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dzMint" x1="24" y1="54" x2="48" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="dzSoftShadow" x="38" y="8" width="84" height="78" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.14"/>
    </filter>
    <filter id="dzBadgeShadow" x="86" y="44" width="46" height="46" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Soft organic backdrop capsule -->
  <rect x="16" y="10" width="112" height="76" rx="38" fill="url(#dzGlow)"/>

  <!-- Decorative subtle sparkles -->
  <circle cx="24" cy="24" r="3" fill="#38bdf8" fill-opacity="0.55"/>
  <circle cx="122" cy="22" r="2.5" fill="#60a5fa" fill-opacity="0.55"/>
  <path d="M126 36l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4L126 36z" fill="#34d399" fill-opacity="0.7"/>

  <!-- Back Tilted Source Image Card -->
  <g transform="rotate(-8 48 48)">
    <rect x="24" y="22" width="52" height="44" rx="12" fill="url(#dzBackCard)" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.6"/>
    <circle cx="38" cy="34" r="4" fill="#60a5fa" fill-opacity="0.55"/>
    <path d="M31 56l11-12a2.5 2.5 0 0 1 3.7 0l6.3 7 4.2-4.4a2.4 2.4 0 0 1 3.5 0L68 56H31z" fill="#3b82f6" fill-opacity="0.28"/>
  </g>

  <!-- Front Crisp Elevated Image Card -->
  <g filter="url(#dzSoftShadow)">
    <rect x="48" y="16" width="60" height="52" rx="14" fill="url(#dzFrontCard)" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="1.5"/>
    <!-- Inner rounded viewport -->
    <rect x="54" y="22" width="48" height="34" rx="9" fill="#dbeafe" fill-opacity="0.55"/>
    <circle cx="66" cy="32" r="4.5" fill="#34d399"/>
    <path d="M56 56l13.5-15a3 3 0 0 1 4.4 0l7.6 8.6 5.2-5.4a2.8 2.8 0 0 1 4.1 0L100 56H56z" fill="url(#dzMtn)"/>
    <!-- Bottom mini format indicator bars -->
    <rect x="55" y="60.5" width="18" height="3.2" rx="1.6" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="76" y="60.5" width="10" height="3.2" rx="1.6" fill="#3b82f6" fill-opacity="0.55"/>
  </g>

  <!-- Floating Left Mint Format-Check Pill -->
  <rect x="22" y="56" width="24" height="24" rx="9" fill="url(#dzMint)"/>
  <path d="M29.5 68l3.2 3.2 6.3-6.4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Right Primary Upload Action Badge -->
  <g filter="url(#dzBadgeShadow)">
    <rect x="93" y="50" width="32" height="32" rx="12" fill="url(#dzBadge)"/>
    <path d="M109 72V60.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M104 65l5-5 5 5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
