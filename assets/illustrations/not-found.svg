<svg xmlns="http://www.w3.org/2000/svg" width="208" height="128" viewBox="0 0 208 128" fill="none">
  <defs>
    <linearGradient id="nfGlow" x1="24" y1="12" x2="184" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="nfCardBack" x1="34" y1="22" x2="108" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="nfCardFront" x1="62" y1="20" x2="152" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#eff6ff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="nfBadge" x1="122" y1="68" x2="178" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="nfWave" x1="74" y1="62" x2="136" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="nfShadow" x="52" y="14" width="110" height="102" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1e3a8a" flood-opacity="0.15"/>
    </filter>
    <filter id="nfBadgeShadow" x="116" y="64" width="70" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Soft organic rounded backdrop -->
  <rect x="20" y="14" width="168" height="100" rx="50" fill="url(#nfGlow)"/>

  <!-- Subtle sparkles -->
  <circle cx="34" cy="36" r="3.2" fill="#38bdf8" fill-opacity="0.55"/>
  <circle cx="176" cy="32" r="2.8" fill="#818cf8" fill-opacity="0.55"/>
  <path d="M180 54l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6 1.6-4z" fill="#34d399" fill-opacity="0.72"/>

  <!-- Back Dashed Missing Frame -->
  <g transform="rotate(-9 68 64)">
    <rect x="34" y="28" width="72" height="62" rx="16" fill="url(#nfCardBack)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.8" stroke-dasharray="5 5"/>
    <circle cx="52" cy="46" r="5" fill="#60a5fa" fill-opacity="0.45"/>
    <path d="M44 76l15-16a3 3 0 0 1 4.4 0l9 10 6-6a2.8 2.8 0 0 1 4 0L94 76H44z" fill="#3b82f6" fill-opacity="0.22"/>
  </g>

  <!-- Front Crisp Elevated Image Frame (Missing Image State) -->
  <g filter="url(#nfShadow)">
    <rect x="64" y="20" width="84" height="72" rx="18" fill="url(#nfCardFront)" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="1.6"/>
    <!-- Inner rounded viewport -->
    <rect x="72" y="28" width="68" height="46" rx="11" fill="#dbeafe" fill-opacity="0.52"/>
    <!-- Soft disconnected mountain / broken image metaphor -->
    <path d="M74 74l17-19a3.2 3.2 0 0 1 4.7 0l8.3 9.2" stroke="url(#nfWave)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M113 62l7.5-8a3 3 0 0 1 4.4 0L138 68" stroke="url(#nfWave)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Centered rounded question mark glyph -->
    <circle cx="106" cy="48" r="13" fill="#ffffff" fill-opacity="0.92" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M102.6 44.8a3.5 3.5 0 0 1 6.8 1.1c0 2.2-3.4 2.5-3.4 4.7" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="106" cy="54.5" r="1.4" fill="#2563eb"/>
    <!-- Bottom mini bar details -->
    <rect x="73" y="80.5" width="24" height="3.6" rx="1.8" fill="#94a3b8" fill-opacity="0.45"/>
    <rect x="102" y="80.5" width="14" height="3.6" rx="1.8" fill="#3b82f6" fill-opacity="0.45"/>
  </g>

  <!-- Floating Rounded 404 Pill Badge -->
  <g filter="url(#nfBadgeShadow)">
    <rect x="122" y="68" width="58" height="32" rx="14" fill="url(#nfBadge)"/>
    <text x="151" y="89.5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">404</text>
  </g>
</svg>
