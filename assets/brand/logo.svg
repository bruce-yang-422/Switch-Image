<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="siBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="siAurora" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(52 10) rotate(135) scale(46)">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="siCardBack" x1="10" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="siCardFront" x1="27" y1="28" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="siMountain" x1="30" y1="38" x2="50" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="siSwapMint" x1="38" y1="13" x2="52" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="siCardShadow" x="22" y="24" width="36" height="33" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#siBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#siAurora)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5"/>

  <!-- Source Image Card (Top-Left, Frosted Glass) -->
  <rect x="11" y="12" width="25" height="21" rx="5.5" fill="url(#siCardBack)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="17.5" cy="18.2" r="2.1" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M13.5 30 L19.8 23.2 C20.3 22.6 21.2 22.6 21.7 23.2 L25.2 27 L27.6 24.7 C28.1 24.2 28.9 24.2 29.4 24.7 L33.5 30 Z" fill="#ffffff" fill-opacity="0.72"/>

  <!-- Top-Right Swap Arrow (Source -> Converted) -->
  <g stroke="url(#siSwapMint)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40.5 15.5 C46.2 15.5, 49.5 18.8, 49.5 24.2"/>
    <polyline points="45.8 21.2 49.5 24.8 53 20.9"/>
  </g>

  <!-- Bottom-Left Swap Arrow (Converted -> Source) -->
  <g stroke="#bae6fd" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23.5 48.5 C17.8 48.5, 14.5 45.2, 14.5 39.8"/>
    <polyline points="11 43.1 14.5 39.2 18.2 42.8"/>
  </g>

  <!-- Converted Image Card (Bottom-Right, Crisp Luminous White) -->
  <g filter="url(#siCardShadow)">
    <rect x="27" y="29" width="26" height="22" rx="5.8" fill="url(#siCardFront)"/>
    <circle cx="34" cy="35.6" r="2.3" fill="#10b981"/>
    <path d="M29.8 48 L36.6 40.4 C37.2 39.7 38.2 39.7 38.8 40.4 L42.4 44.4 L45.1 41.7 C45.7 41.1 46.7 41.1 47.3 41.7 L50.4 48 Z" fill="url(#siMountain)"/>
  </g>
</svg>
